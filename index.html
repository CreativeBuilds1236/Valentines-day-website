<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine? 💕</title>
    <link rel="stylesheet" href="styles.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        (function(){
            emailjs.init("ybx1QzwycQ0-1NioT");
        })();
    </script>
</head>
<body>
    <div class="heart-bg" id="heartBg"></div>

    <div class="container">
        <div id="questionSection">
            <h1>💕 Hey "Recivers Name" ! 💕</h1>
            <p class="question">Will you be my Valentine? 🌹</p>
            
            <div class="gif-container">
                <img src="kitten.jpg" alt="cute couple">
            </div>

            <div class="buttons">
                <button id="yesBtn">Yes! 💖</button>
                <button id="noBtn">No 😢</button>
            </div>
        </div>

        <div id="successMessage" class="success-message">
            <div class="celebration">🎉💕🎊</div>
            <p class="love-message">AWWW YAYY THANKYOU MY LOVEEE! 🤭💖</p>
            <p class="sub-message">
                You're the best Valentine ever! 💝<br>
                Can't wait to share this special day with you!<br>
                LOVE!: YOUR ONE AND ONLY "YOUR NAME" 🤭
            </p>
            <div style="margin-top: 30px; font-size: 60px;">
                😊💕✨🎈💖
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
